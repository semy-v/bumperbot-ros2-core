# robot_move_scenario.yaml
publish_rate: 100.0  # Defines how often (Hz) the current step velocities are emitted to the transceiver node

steps:
  # Step 1: Let the robot sit stationary for stabilization tracking
  - right_wheel_velocity: 0.0
    left_wheel_velocity: 0.0
    duration: 2.0

  # Step 2: Very low speed forward to check stability
  - right_wheel_velocity: 2.0
    left_wheel_velocity: 2.0
    duration: 4.0

  # Step 3:  Medium forward speed to check stability
  - right_wheel_velocity: 5.0
    left_wheel_velocity: 5.0
    duration: 3.0

  # Step 4: Cruise forward tracking behavior
  - right_wheel_velocity: 8.0
    left_wheel_velocity: 8.0
    duration: 3.0

  # Step 5: Fast linear burst forward to check overshoot behaviors
  - right_wheel_velocity: 13.0
    left_wheel_velocity: 13.0
    duration: 3.0

  # Step 5: Stationary break to study deceleration tracking/integral windup dump
  - right_wheel_velocity: 0.0
    left_wheel_velocity: 0.0
    duration: 2.0

  # Step 7: Fast linear burst backward to check overshoot behaviors
  - right_wheel_velocity: -10.0
    left_wheel_velocity: -10.0
    duration: 3.0

  # Step 8: Cruise backward tracking behavior
  - right_wheel_velocity: -8.0
    left_wheel_velocity: -8.0
    duration: 3.0

  # Step 9: Medium backward tracking behavior
  - right_wheel_velocity: -5.0
    left_wheel_velocity: -5.0
    duration: 3.0

  # Step 10: Very low speed backward to check stability
  - right_wheel_velocity: -2.0
    left_wheel_velocity: -2.0
    duration: 4.0

  # Step 9: Stationary break to study deceleration tracking/integral windup dump
  - right_wheel_velocity: 0.0
    left_wheel_velocity: 0.0
    duration: 2.0

  # Step 10: High speed counter-rotation spin to evaluate matching differential wheel accuracy 
  - right_wheel_velocity: -7.0
    left_wheel_velocity: 7.0
    duration: 5.0

  # Step 11: High speed rotation spin to evaluate matching differential wheel accuracy 
  - right_wheel_velocity: 7.0
    left_wheel_velocity: -7.0
    duration: 5.0

  # Step 12: Medium speed counter-rotation spin to evaluate matching differential wheel accuracy 
  - right_wheel_velocity: -4.0
    left_wheel_velocity: 4.0
    duration: 5.0

  # Step 12: Medium speed rotation spin to evaluate matching differential wheel accuracy 
  - right_wheel_velocity: 4.0
    left_wheel_velocity: -4.0
    duration: 5.0

  # Step 13: Low speed counter-rotation spin to evaluate matching differential wheel accuracy 
  - right_wheel_velocity: -1.0
    left_wheel_velocity: 1.0
    duration: 5.0

  # Step 13: Very low speed rotation spin to evaluate matching differential wheel accuracy 
  - right_wheel_velocity: 1.0
    left_wheel_velocity: -1.0
    duration: 5.0