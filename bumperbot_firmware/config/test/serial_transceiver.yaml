serial_transceiver:
  ros__parameters:
    port: "/dev/ttyACM0"
    baudrate: 115200
    imu_frame_id: "imu_link"
    imu_calibration_ms: 2000

    control_rate_hz: 200

    left_wheel:
      feedforward_ks_forward: 17.86
      feedforward_ks_reverse: 15.68
      feedforward_kv: 14.26
      feedback_kp: 3.0
      feedback_ki: 25.0
      feedback_kd: 0.0
      max_pid_correction: 50

    right_wheel:
      feedforward_ks_forward: 17.34
      feedforward_ks_reverse: 15.26
      feedforward_kv: 14.72
      feedback_kp: 3.0
      feedback_ki: 27.0
      feedback_kd: 0.0
      max_pid_correction: 50