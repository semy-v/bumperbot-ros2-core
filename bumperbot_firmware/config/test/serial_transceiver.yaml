serial_transceiver:
  ros__parameters:
    port: "/dev/ttyACM0"
    baudrate: 115200
    imu_frame_id: "imu_link"
    imu_calibration_ms: 2000

    control_rate_hz: 100

    right_wheel:
      feedforward_ks: 13.25
      feedforward_kv: 11.29
      feedback_kp: 0.0
      feedback_ki: 0.0
      feedback_kd: 0.0
      max_feedback_pwm: 100

    left_wheel:
      feedforward_ks: 13.23
      feedforward_kv: 10.93
      feedback_kp: 0.0
      feedback_ki: 0.0
      feedback_kd: 0.0
      max_feedback_pwm: 100