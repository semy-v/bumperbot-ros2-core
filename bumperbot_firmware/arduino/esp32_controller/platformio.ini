; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:arduino_nano_esp32]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
platform_packages = toolchain-xtensa-esp32s3@12.2.0+20230208
lib_deps = dlloydev/QuickPID@^3.1.9
build_unflags = -std=gnu++11
build_flags = -std=gnu++20
build_src_filter = +<*> -<test/*>

[env:diff_drive_test]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
platform_packages = toolchain-xtensa-esp32s3@12.2.0+20230208
build_unflags = -std=gnu++11
build_flags = -std=gnu++20
build_src_filter = +<test/diff_drive*> +<bl2418_encoder.cpp>

[env:diff_drive_feedforward_calibration]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
platform_packages = toolchain-xtensa-esp32s3@12.2.0+20230208
lib_deps = dlloydev/QuickPID@^3.1.9
build_unflags = -std=gnu++11
build_flags = -std=gnu++20
build_src_filter = +<diff_drive/*> +<test/diff_drive_feedforward/*>

[env:imu_test]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
platform_packages = toolchain-xtensa-esp32s3@12.2.0+20230208
build_unflags = -std=gnu++11
build_flags = -std=gnu++20
build_src_filter = +<test/imu_test.cpp>

